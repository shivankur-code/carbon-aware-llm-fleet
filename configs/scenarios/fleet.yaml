# Phase-3 reference scenario: 6 years, three grids, growing AI inference demand, an existing
# A100/H100 fleet. Units: node-equivalents of a fully busy new_gpu (8x H100) host.
# Solve with the LP relaxation (integer: false) - fleet is thousands of nodes.
name: fleet
horizon_q: 24
regions: [clean, mixed, dirty]
skus: [new_gpu, green_gpu, old_gpu]
buyable: [new_gpu, green_gpu]
max_age_q: {new_gpu: 32, green_gpu: 32, old_gpu: 16}
initial_fleet:
  - {sku: old_gpu, tier: LC, region: clean, age_q: 0, count: 150}
  - {sku: new_gpu, tier: LC, region: clean, age_q: 6, count: 100}
  - {sku: old_gpu, tier: LC, region: mixed, age_q: 0, count: 500}
  - {sku: new_gpu, tier: LC, region: mixed, age_q: 8, count: 350}
  - {sku: old_gpu, tier: LC, region: dirty, age_q: 0, count: 400}
  - {sku: new_gpu, tier: LC, region: dirty, age_q: 4, count: 250}
demand:
  LC:
    clean: {start: 180, growth_per_year: 0.25}
    mixed: {start: 450, growth_per_year: 0.25}
    dirty: {start: 330, growth_per_year: 0.30}
  BATCH: {start: 150, growth_per_year: 0.35}
pools:   # reused DIMMs / SSDs from the (out-of-scope) general-purpose CPU fleet + local retirements
  dram_dimm: {initial: 3200, external_per_q: 2400, yield: 0.9}
  ssd: {initial: 800, external_per_q: 600, yield: 0.9}
util_cap: 0.8
lc_failure_buffer: 3.0
ship_kg_per_node: 300
ship_cost_usd_per_node: 5000
integer: false
